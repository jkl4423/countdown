<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Das Böse erwacht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;900&family=Cinzel+Decorative:wght@700&family=IM+Fell+English:ital@1&family=Jim+Nightshade&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="data/skull.jpeg">
<style>
  :root {
    --bg: #000;
    --gold: #b08f4f;
    --gold-dim: #7a6033;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--gold);
    font-family: 'Cinzel', serif;
    overflow: hidden;
  }

  .layer { position: fixed; inset: 0; pointer-events: none; }
  .screen { position: fixed; inset: 0; overflow: hidden; }

  /* =========================================================
     TOR
     ========================================================= */

  #gate { z-index: 3; transition: opacity 2s ease 2.4s; }
  #gate[hidden] { display: none; }

  /* 16:9-Fläche, die den Viewport immer abdeckt;
     Overlays in % dieser Fläche bleiben so auf dem Tor. */
  .stage {
    position: absolute;
    left: 50%;
    top: 50%;
    width: max(100vw, 177.78vh);
    height: max(100vh, 56.25vw);
    transform: translate(-50%, -50%);
  }
  /* Handy: sichtbare Höhe ohne Browserleisten */
  @supports (height: 100dvh) {
    .stage {
      width: max(100vw, 177.78dvh);
      height: max(100dvh, 56.25vw);
    }
  }

  .scene {
    position: absolute;
    inset: 0;
    transform-origin: 50% 52%;
    animation: slowzoom 70s ease-in-out infinite alternate;
  }

  .scene img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    filter: brightness(.5) contrast(1.15) saturate(.9);
    user-select: none;
  }

  /* hellere Kopie des Bildes, nur im Bereich der Tür sichtbar */
  .scene img.door-lit {
    filter: brightness(.95) contrast(1.1) saturate(.95);
    -webkit-mask-image: radial-gradient(ellipse 15% 46% at 50.3% 57%, #000 45%, transparent 100%);
    mask-image: radial-gradient(ellipse 15% 46% at 50.3% 57%, #000 45%, transparent 100%);
    pointer-events: none;
  }

  /* schwacher warmer Widerschein des Spalts auf den Torflügeln */
  .door-wash {
    position: absolute;
    left: 38%;
    top: 16%;
    width: 24.5%;
    height: 82%;
    background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(255, 100, 30, .14), transparent 75%);
    mix-blend-mode: screen;
    animation: shimmer 8s ease-in-out infinite -3s;
    pointer-events: none;
  }

  /* glühender Spalt zwischen den Torflügeln */
  .slit {
    position: absolute;
    left: 47%;
    width: 6%;
    top: 9%;
    height: 87%;
    background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255, 110, 30, .55), rgba(193, 30, 10, .2) 45%, transparent 75%);
    mix-blend-mode: screen;
    animation: shimmer 5s ease-in-out infinite;
    pointer-events: none;
  }

  .seal-glow {
    position: absolute;
    left: 42%;
    top: 36%;
    width: 16%;
    height: 28%;
    background: radial-gradient(circle at 50% 50%, rgba(255, 120, 40, .45), rgba(160, 20, 5, .15) 40%, transparent 70%);
    mix-blend-mode: screen;
    animation: sealpulse 7s ease-in-out infinite;
    pointer-events: none;
  }

  .floor-glow {
    position: absolute;
    left: 35%;
    top: 84%;
    width: 30%;
    height: 16%;
    background: radial-gradient(ellipse 50% 40% at 50% 30%, rgba(255, 90, 20, .3), transparent 70%);
    mix-blend-mode: screen;
    animation: shimmer 6s ease-in-out infinite -2s;
    pointer-events: none;
  }

  /* klickbarer Bereich = Torflügel */
  .door {
    position: absolute;
    left: 40%;
    top: 20%;
    width: 20.5%;
    height: 75%;
    border: none;
    background: none;
    border-radius: 48% 48% 0 0 / 18% 18% 0 0;
    cursor: pointer;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .door::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(ellipse 30% 60% at 50% 50%, rgba(255, 110, 30, .22), transparent 70%);
    mix-blend-mode: screen;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  .door:hover::after, .door:focus-visible::after { opacity: 1; }

  /* dunkelroter Nebel, der beim Öffnen aus dem Spalt herausquillt */
  .burst {
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
  }
  .burst i {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 240vmax;
    height: 240vmax;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(.01);
  }
  .burst i:nth-child(1) {
    background: radial-gradient(circle,
      rgba(150, 35, 10, .85) 0%, rgba(95, 12, 5, .85) 12%, rgba(50, 3, 2, .92) 28%, rgba(14, 0, 0, .97) 45%, rgba(0, 0, 0, 0) 68%);
  }
  /* unregelmässige Wolkenballen um den Kern */
  .burst i:nth-child(2) {
    background:
      radial-gradient(ellipse 14% 9% at 42% 46%, rgba(130, 25, 8, .55), transparent 70%),
      radial-gradient(ellipse 10% 14% at 58% 54%, rgba(110, 15, 5, .5), transparent 70%),
      radial-gradient(ellipse 18% 8% at 50% 60%, rgba(90, 10, 4, .45), transparent 70%),
      radial-gradient(ellipse 9% 12% at 46% 38%, rgba(100, 14, 5, .4), transparent 70%);
  }
  .burst i:nth-child(3) {
    background:
      radial-gradient(ellipse 12% 16% at 36% 55%, rgba(80, 8, 3, .5), transparent 70%),
      radial-gradient(ellipse 16% 10% at 64% 42%, rgba(90, 10, 4, .45), transparent 70%),
      radial-gradient(ellipse 10% 10% at 55% 66%, rgba(120, 22, 8, .35), transparent 70%);
  }

  /* treibende Rauchschwaden über dem Rot */
  .burst-fog {
    width: 200%;
    background:
      radial-gradient(ellipse 18% 22% at 15% 40%, rgba(60, 10, 8, .55), transparent 70%),
      radial-gradient(ellipse 22% 16% at 38% 70%, rgba(20, 2, 2, .6), transparent 70%),
      radial-gradient(ellipse 16% 20% at 62% 30%, rgba(70, 12, 8, .5), transparent 70%),
      radial-gradient(ellipse 24% 18% at 85% 65%, rgba(20, 2, 2, .6), transparent 70%);
    filter: blur(40px);
    opacity: 0;
    animation: drift 40s linear infinite;
  }

  .gate-fog { width: 200%; }

  .gate-vignette {
    background: radial-gradient(ellipse 70% 80% at 50% 55%, transparent 42%, rgba(0, 0, 0, .7) 75%, #000 100%);
  }

  .hint {
    position: absolute;
    left: 0;
    right: 0;
    bottom: clamp(16px, 4vh, 40px);
    padding: 0 16px;
    text-align: center;
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: clamp(1rem, 2.6vw, 1.4rem);
    letter-spacing: .05em;
    color: var(--gold-dim);
    text-shadow: 0 2px 8px #000;
    opacity: 0;
    animation: hintin 4s 2s forwards, breathe-text 6s 6s ease-in-out infinite;
    pointer-events: none;
  }

  /* ---------- Öffnen ---------- */

  /* Hineinzoomen auf .stage, damit der langsame Ruhe-Zoom von .scene
     weiterlaufen kann – sonst springt das Bild beim Klick kurz zurück */
  body.opening .stage {
    transform: translate(-50%, -50%) scale(1.6);
    transition: transform 3.2s cubic-bezier(.55, 0, .45, 1);
  }
  body.opening .slit {
    animation: none;
    opacity: 1;
    transform: scaleX(6);
    filter: brightness(1.4);
    transition: transform 1.6s ease-in, filter 1s ease;
  }
  body.opening .seal-glow,
  body.opening .floor-glow {
    animation: none;
    opacity: 1;
    filter: brightness(1.5);
    transition: filter 1s ease;
  }
  body.opening .burst { opacity: 1; transition: opacity 1.2s ease .4s; }
  body.opening .burst i {
    transform: translate(-50%, -50%) scale(1);
    transition: transform 3.2s cubic-bezier(.55, 0, .7, .6) .4s;
  }
  body.opening .burst i:nth-child(2) {
    transform: translate(-50%, -50%) scale(1.1) rotate(25deg);
    transition: transform 3.6s cubic-bezier(.5, 0, .7, .6) .6s;
  }
  body.opening .burst i:nth-child(3) {
    transform: translate(-50%, -50%) scale(1.2) rotate(-20deg);
    transition: transform 4s cubic-bezier(.5, 0, .7, .6) .8s;
  }
  body.opening .burst-fog { opacity: 1; transition: opacity 2s ease 1.2s; }
  body.opening .hint { animation: none; opacity: 0; transition: opacity .6s; }
  body.opening #gate { opacity: 0; pointer-events: none; }

  /* =========================================================
     COUNTDOWN
     ========================================================= */

  #count { z-index: 1; opacity: 0; transition: opacity 2.6s ease 2.2s; }
  body.opening #count { opacity: 1; }

  /* Hochformat 9:16, volle Höhe, mittig; Ränder schwarz */
  .portrait {
    position: absolute;
    left: 50%;
    top: 50%;
    height: 100vh;
    height: 100dvh;
    aspect-ratio: 9 / 16;
    transform: translate(-50%, -50%);
  }

  .figure {
    position: absolute;
    inset: 0;
    transform-origin: 50% 40%;
    animation: breathe 14s ease-in-out infinite;
    transition: opacity 4s ease;
  }

  /* ---------- Szenen-Rotation: Schädel weicht, ein Dämon erscheint ---------- */

  #count.skull-off .figure { opacity: 0; }

  /* nur die Mitte des Bildes: die Ränder (unten rechts das Spiel-Logo)
     liegen ausserhalb des 9:16-Ausschnitts und werden zusätzlich weich ausgeblendet.
     Alle Angaben in % des Hochformats -> auf Handy und Desktop derselbe Ausschnitt */
  .appar {
    position: absolute;
    inset: 0;
    overflow: hidden;
    opacity: 0;
    transition: opacity 3s ease;
    -webkit-mask-image: radial-gradient(ellipse 52% 48% at 50% 38%, #000 50%, transparent 100%);
    mask-image: radial-gradient(ellipse 52% 48% at 50% 38%, #000 50%, transparent 100%);
  }
  .appar.on { opacity: 1; }

  /* Ursprung auf dem Kopf: Zoomen, Wanken und Zittern kreisen um ihn */
  .appar-head {
    position: absolute;
    inset: 0;
    transform-origin: 50% 35%;
    scale: 1.05;
  }

  .appar img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(.7) contrast(1.15);
    user-select: none;
  }

  .appar.jolt .eye { animation: eyes-awake .45s; }

  /* Mephisto: langsames Heranzoomen, Wanken, Zittern, ruckartiges Zucken */
  #mep .eye { top: 32%; width: 6%; height: 3%; }
  #mep .eye.l { left: 38%; }
  #mep .eye.r { left: 56.6%; }
  #mep.run .appar-head {
    animation:
      mep-push 18s cubic-bezier(.25, 0, .35, 1) forwards,
      mep-sway 7s ease-in-out infinite,
      mep-tremble .4s linear infinite;
  }
  #mep.run img { animation: mep-flicker 6s infinite; }
  #mep.run.jolt img { animation: mep-jolt .45s linear; }

  /* Baal: steigt aus der Tiefe auf, pulsiert, neigt den Kopf;
     ein Geisterbild flackert neben ihm, beim Zucken springt das Bild wie gestört */
  #baal .appar-head { transform-origin: 50% 37%; }
  #baal .eye { top: 33.5%; width: 6%; height: 3%; }
  #baal .eye.l { left: 38.8%; }
  #baal .eye.r { left: 56.1%; }
  #baal .echo {
    scale: 1.06;
    translate: 1.5% -1%;
    mix-blend-mode: screen;
    opacity: 0;
  }
  #baal.run .appar-head {
    animation:
      baal-rise 16s cubic-bezier(.2, 0, .3, 1) forwards,
      baal-throb 2.8s ease-in-out infinite,
      baal-tilt 9s ease-in-out infinite;
  }
  #baal.run img:not(.echo) { animation: baal-flicker 5s infinite; }
  #baal.run .echo { animation: baal-echo 4.5s ease-in-out infinite; }
  #baal.run.jolt img:not(.echo) { animation: baal-glitch .5s steps(1); }
  #baal.run.jolt .echo { animation: baal-echo-flash .5s steps(1); }

  /* Diablo: schwerer Zoom, ständiges Grollen, Herzschlag im Rot,
     das Juwel auf der Stirn glüht mit, beim Zucken bebt alles */
  #dia .appar-head { transform-origin: 50% 32%; }
  #dia .eye { top: 29.5%; width: 7%; height: 3%; }
  #dia .eye.l { left: 35%; }
  #dia .eye.r { left: 58.8%; }
  #dia .gem {
    position: absolute;
    left: 45.8%;
    top: 19.7%;
    width: 10%;
    height: 6%;
    background: radial-gradient(ellipse, rgba(255, 170, 60, .8), rgba(230, 70, 10, .3) 40%, transparent 70%);
    mix-blend-mode: screen;
    opacity: .4;
    pointer-events: none;
  }
  #dia.run .appar-head {
    animation:
      dia-push 20s cubic-bezier(.3, 0, .3, 1) forwards,
      dia-rumble .22s linear infinite;
  }
  #dia.run img { animation: dia-heartbeat 1.6s ease-out infinite; }
  #dia.run .gem { animation: dia-gem 1.6s ease-out infinite; }
  #dia.run.jolt img { animation: dia-quake .6s linear; }
  #dia.run.jolt .gem { animation: none; opacity: 1; }

  /* nach Ablauf: die Rotation hat nichts mehr zu sagen – das Finale wechselt
     zufällig zwischen Schädel (.final-off blendet ihn aus) und den Dämonen (.final) */
  body.awake #count .figure { opacity: 1; }
  body.awake #count.final-off .figure { opacity: 0; }
  body.awake #count .appar { opacity: 0; }
  body.awake #count .appar.final { opacity: 1; }

  /* dieselbe Raserei wie beim Schädel: Beben, flackerndes Bild, zuckende Augen */
  body.awake #count .appar.final .appar-head { scale: 1.15; rotate: none; translate: none; animation: quake .32s linear infinite; }
  body.awake #count .appar.final img { animation: imgflicker 1.7s infinite; }
  body.awake #count .appar.final .echo { animation: none; opacity: 0; }
  body.awake #count .appar.final .gem { animation: shimmer 1.2s infinite; filter: brightness(1.8); }

  .figure img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    filter: brightness(.6) contrast(1.1);
    user-select: none;
  }

  .circle-glow {
    position: absolute;
    left: 5%;
    top: 12%;
    width: 90%;
    height: 44%;
    background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(170, 25, 10, .35), transparent 70%);
    mix-blend-mode: screen;
    animation: shimmer 9s ease-in-out infinite;
    pointer-events: none;
  }

  .eye {
    position: absolute;
    top: 38.8%;
    width: 7%;
    height: 3.5%;
    background: radial-gradient(circle, rgba(255, 60, 30, .9), rgba(200, 20, 10, .35) 35%, transparent 70%);
    mix-blend-mode: screen;
    animation: eyes 5s ease-in-out infinite;
    pointer-events: none;
  }
  .eye.l { left: 41.2%; }
  .eye.r { left: 52.8%; }

  .edges {
    position: absolute;
    inset: -1px;
    background:
      linear-gradient(90deg, #000 0%, transparent 18%, transparent 82%, #000 100%),
      linear-gradient(180deg, #000 0%, transparent 10%, transparent 70%, #000 100%);
    pointer-events: none;
  }

  .count-vignette {
    background: radial-gradient(ellipse 75% 80% at 50% 45%, transparent 40%, rgba(0, 0, 0, .7) 80%, #000 100%);
  }

  main {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    text-align: center;
    padding: 16px 16px clamp(24px, 7vh, 64px);
  }

  .countdown {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: clamp(.5rem, 2vw, 1.25rem);
    width: min(100%, 720px);
  }

  .unit {
    position: relative;
    padding: clamp(.7rem, 1.8vw, 1.1rem) .3rem;
    background: rgba(0, 0, 0, .6);
    border: 1px solid rgba(140, 111, 58, .18);
    box-shadow: inset 0 0 25px rgba(90, 0, 0, .35), 0 0 24px rgba(0, 0, 0, .9);
  }

  /* ---------- Ziffern: dunkel wie getrocknetes Blut, glimmen im Takt der Augen ---------- */

  .num {
    position: relative;
    display: block;
    font-weight: 900;
    font-size: clamp(2rem, 7vw, 4.5rem);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: #6a1c13;
    text-shadow: 0 0 .18em rgba(120, 10, 5, .45), 0 2px 0 #000;
    animation: smoulder 5s ease-in-out infinite;   /* gleicher Rhythmus wie .eye */
    transition: opacity .8s ease-out, filter .8s ease-out, transform .8s ease-out;
  }

  /* neue Ziffer taucht aus dem Dunkel auf */
  .unit.tick .num {
    opacity: .08;
    filter: blur(4px);
    transform: scale(1.06);
    transition: none;
  }

  /* gelegentliches Aussetzen, wie eine sterbende Glut */
  .unit.flicker .num {
    opacity: .15;
    transition: none;
  }

  .label {
    position: relative;
    display: block;
    margin-top: .5rem;
    font-size: clamp(.6rem, 1.5vw, .8rem);
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--gold-dim);
  }

  /* ---------- Countdown abgelaufen ---------- */

  /* auf dunklem Grund: "Es ist an der Zeit …", dann "… Sanktuario wartet auf Euch!";
     der letzte Satz rutscht danach nach unten und bleibt gedämpft stehen */
  .finale-words {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: none;
    pointer-events: none;
  }
  body.awake .countdown { display: none; }
  body.awake .finale-words { display: block; }

  .finale-words p {
    position: absolute;
    left: 16px;
    right: 16px;
    top: 50%;
    translate: 0 -50%;
    text-align: center;
    text-wrap: balance;
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.5rem, 5.5vw, 3.2rem);
    line-height: 1.25;
    letter-spacing: .03em;
    color: #8a2618;
    text-shadow: 0 0 .3em rgba(170, 20, 8, .6), 0 2px 0 #000;
    opacity: 0;
    filter: blur(8px);
    transition: opacity 2.2s ease, filter 2.2s ease,
                top 3s ease-in-out, font-size 3s ease-in-out, color 3s ease, text-shadow 3s ease;
  }
  .finale-words p.in { opacity: 1; filter: blur(0); }

  .finale-words p.settle {
    top: calc(100% - clamp(32px, 8vh, 72px));
    font-size: clamp(1rem, 2.8vw, 1.6rem);
    color: rgba(150, 40, 25, .8);
    text-shadow: 0 0 .25em rgba(110, 8, 4, .35), 0 2px 0 #000;
  }
  .finale-words p.in.settle { opacity: .7; animation: settle-breathe 8s ease-in-out 3s infinite; }

  /* Kopf vibriert, Bild und Augen flackern heftig */
  body.awake .figure { animation: quake .32s linear infinite; }
  body.awake .figure img { animation: imgflicker 1.7s infinite; }
  body.awake .eye { animation: eyes-awake .7s infinite; }
  body.awake .circle-glow { animation: shimmer 1.2s infinite; filter: brightness(1.8); }

  /* =========================================================
     Gemeinsam
     ========================================================= */

  .fog {
    width: 200%;
    background:
      radial-gradient(ellipse 22% 18% at 12% 82%, rgba(110, 95, 95, .13), transparent 70%),
      radial-gradient(ellipse 18% 14% at 38% 94%, rgba(80, 55, 55, .15), transparent 70%),
      radial-gradient(ellipse 26% 16% at 62% 80%, rgba(110, 95, 95, .11), transparent 70%),
      radial-gradient(ellipse 20% 15% at 88% 92%, rgba(80, 55, 55, .15), transparent 70%);
    filter: blur(26px);
    animation: drift 75s linear infinite;
  }
  .fog.two {
    top: -20%;
    opacity: .65;
    animation-duration: 115s;
    animation-direction: reverse;
  }

  #embers { position: fixed; inset: 0; z-index: 4; width: 100%; height: 100%; pointer-events: none; }

  .sound-toggle {
    position: fixed;
    right: 16px;
    top: 16px;
    z-index: 5;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid rgba(140, 111, 58, .3);
    background: rgba(0, 0, 0, .6);
    color: var(--gold-dim);
    cursor: pointer;
    opacity: .5;
    transition: opacity .3s;
  }
  .sound-toggle:hover, .sound-toggle:focus-visible { opacity: 1; outline: none; }
  .sound-toggle .off { display: none; }
  .sound-toggle.muted .on { display: none; }
  .sound-toggle.muted .off { display: block; }

  .blackout {
    position: fixed;
    inset: 0;
    z-index: 6;
    background: #000;
    pointer-events: none;
    opacity: 0;
    animation: fadeout 3s ease;
  }

  /* ---------- Animationen ---------- */

  @keyframes slowzoom { from { transform: scale(1); } to { transform: scale(1.07); } }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes fadeout { from { opacity: 1; } }
  @keyframes hintin { to { opacity: .75; } }
  @keyframes breathe-text { 0%, 100% { opacity: .75; } 50% { opacity: .35; } }
  @keyframes pulse { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }

  @keyframes shimmer {
    0%, 100% { opacity: .55; }
    18% { opacity: .8; }
    20% { opacity: .45; }
    23% { opacity: .75; }
    50% { opacity: 1; }
    74% { opacity: .6; }
    76% { opacity: .85; }
  }

  @keyframes sealpulse { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }

  @keyframes eyes {
    0%, 100% { opacity: .35; }
    40%      { opacity: .9; }
    46%      { opacity: .2; }
    50%      { opacity: .8; }
    70%      { opacity: .5; }
  }

  /* ---------- Geisterschrift: Namen zerfallen, Flüstern verweht ---------- */

  .ghosts {
    position: absolute;
    inset: 0;
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
  }

  /* bricht nur zwischen Wörtern um, falls ein Text breiter als das Handy ist */
  .ghost {
    position: absolute;
    max-width: calc(100% - 32px);
    text-align: center;
    letter-spacing: .04em;
    opacity: 0;
    filter: blur(8px);
    transition: opacity 1.8s ease, filter 1.8s ease;
  }
  .ghost.in { opacity: 1; filter: blur(0); }

  /* Namen in Fraktur – wie eine Inschrift oder ein Fluch */
  .ghost.name {
    font-family: 'UnifrakturMaguntia', serif;
    font-size: clamp(1.5rem, 5.5vw, 3.3rem);
    color: rgba(150, 28, 18, .6);
    text-shadow: 0 0 .15em #000, 0 0 .4em rgba(110, 0, 0, .6);
  }

  /* Flüstern in kratziger Handschrift */
  .ghost.whisper {
    font-family: 'Jim Nightshade', cursive;
    font-size: clamp(1.15rem, 3.8vw, 2.3rem);
    color: rgba(200, 180, 160, .35);
    text-shadow: 0 0 .5em rgba(0, 0, 0, .9);
    transition-duration: 2.5s;
  }
  /* die Frage an die beiden: etwas deutlicher als das Flüstern */
  .ghost.whisper.ask {
    font-size: clamp(1.4rem, 4.6vw, 2.8rem);
    color: rgba(215, 190, 165, .6);
  }
  .ghost.whisper.out {
    opacity: 0;
    filter: blur(10px);
    transform: translateY(-24px);
    transition: opacity 2.6s ease, filter 2.6s ease, transform 2.6s ease;
  }

  .ghost .w { display: inline-block; white-space: nowrap; }

  .ghost .ch {
    display: inline-block;
    transition: transform 1.8s cubic-bezier(.5, 0, .9, .6), opacity 1.8s ease-in, filter 1.8s ease-in;
  }
  .ghost .ch.fall {
    transform: translate(var(--dx), var(--dy)) rotate(var(--rot));
    opacity: 0;
    filter: blur(2px);
  }

  @keyframes quake {
    0%, 100% { transform: translate(0, 0) rotate(0); }
    20%      { transform: translate(-3px, 1px) rotate(-.3deg); }
    40%      { transform: translate(2px, -2px) rotate(.25deg); }
    60%      { transform: translate(-2px, -1px) rotate(-.2deg); }
    80%      { transform: translate(3px, 2px) rotate(.3deg); }
  }

  @keyframes mep-push { from { scale: 1.05; } to { scale: 1.4; } }

  @keyframes mep-sway {
    0%, 100% { rotate: 0deg; }
    30%      { rotate: -1.4deg; }
    55%      { rotate: .6deg; }
    80%      { rotate: 1.2deg; }
  }

  @keyframes mep-tremble {
    0%, 100% { translate: 0 0; }
    25%      { translate: -1.5px .8px; }
    50%      { translate: 1px -1.2px; }
    75%      { translate: -.8px -.6px; }
  }

  @keyframes mep-flicker {
    0%, 100% { filter: brightness(.7) contrast(1.15); }
    20%      { filter: brightness(.55) contrast(1.15); }
    22%      { filter: brightness(.8) contrast(1.2); }
    24%      { filter: brightness(.45) contrast(1.15); }
    26%      { filter: brightness(.72) contrast(1.15); }
    60%      { filter: brightness(.62) contrast(1.15); }
    63%      { filter: brightness(.35) contrast(1.15); }
    65%      { filter: brightness(.75) contrast(1.15); }
  }

  @keyframes mep-jolt {
    0%, 100% { translate: 0 0; filter: brightness(.7) contrast(1.15); }
    15%      { translate: -7px 3px; filter: brightness(1.05) contrast(1.35) saturate(1.3); }
    30%      { translate: 6px -4px; filter: brightness(.4) contrast(1.2); }
    45%      { translate: -4px -2px; filter: brightness(.95) contrast(1.3) saturate(1.2); }
    60%      { translate: 5px 3px; filter: brightness(.5) contrast(1.2); }
    80%      { translate: -2px 1px; filter: brightness(.8) contrast(1.2); }
  }

  @keyframes baal-rise { from { translate: 0 7%; } to { translate: 0 0; } }
  @keyframes baal-throb { 0%, 100% { scale: 1.16; } 45% { scale: 1.25; } 55% { scale: 1.23; } }

  @keyframes baal-tilt {
    0%, 100% { rotate: 0deg; }
    35%      { rotate: 2.2deg; }
    50%      { rotate: 1.6deg; }
    75%      { rotate: -1.8deg; }
  }

  @keyframes baal-flicker {
    0%, 100% { filter: brightness(.7) contrast(1.15); }
    30%      { filter: brightness(.6) contrast(1.15) hue-rotate(-12deg); }
    32%      { filter: brightness(.85) contrast(1.25) hue-rotate(-20deg) saturate(1.2); }
    34%      { filter: brightness(.5) contrast(1.15); }
    70%      { filter: brightness(.75) contrast(1.2); }
    72%      { filter: brightness(.4) contrast(1.15); }
    74%      { filter: brightness(.7) contrast(1.15); }
  }

  @keyframes baal-echo {
    0%, 100% { opacity: 0; filter: blur(3px) brightness(.6); }
    40%      { opacity: .3; filter: blur(1px) brightness(.8); }
    55%      { opacity: .08; }
    60%      { opacity: .35; filter: blur(2px) brightness(.9); }
  }

  @keyframes baal-glitch {
    0%   { translate: -9px 0; transform: skewX(4deg); filter: brightness(1) contrast(1.4) hue-rotate(-25deg); }
    20%  { translate: 7px 2px; transform: skewX(-6deg); filter: brightness(.35) contrast(1.2); }
    40%  { translate: -3px -2px; transform: skewX(2deg); filter: brightness(.95) contrast(1.35) saturate(1.4); }
    60%  { translate: 10px 0; transform: skewX(-3deg); filter: brightness(.5) contrast(1.2); }
    80%  { translate: -2px 1px; transform: none; filter: brightness(.8) contrast(1.2); }
    100% { translate: 0 0; transform: none; filter: brightness(.7) contrast(1.15); }
  }

  @keyframes baal-echo-flash {
    0%   { opacity: .6; filter: blur(0) brightness(1.1); }
    40%  { opacity: 0; }
    60%  { opacity: .5; filter: blur(1px) brightness(.9); }
    100% { opacity: 0; }
  }

  @keyframes dia-push { from { scale: 1.1; } to { scale: 1.45; } }

  @keyframes dia-rumble {
    0%, 100% { translate: 0 0; }
    25%      { translate: .6px 1.4px; }
    50%      { translate: -.8px -.6px; }
    75%      { translate: .4px -1.2px; }
  }

  /* doppelter Schlag: bumm-bumm … Pause */
  @keyframes dia-heartbeat {
    0%, 100% { filter: brightness(.65) contrast(1.15); }
    8%       { filter: brightness(.9) contrast(1.25) saturate(1.3); }
    18%      { filter: brightness(.7) contrast(1.15); }
    26%      { filter: brightness(.85) contrast(1.22) saturate(1.2); }
    45%      { filter: brightness(.65) contrast(1.15); }
  }
  @keyframes dia-gem {
    0%, 45%, 100% { opacity: .35; }
    8%            { opacity: 1; }
    18%           { opacity: .5; }
    26%           { opacity: .9; }
  }

  @keyframes dia-quake {
    0%, 100% { translate: 0 0; filter: brightness(.65) contrast(1.15); }
    10%      { translate: -10px 6px; filter: brightness(1.25) contrast(1.4) saturate(1.5); }
    25%      { translate: 9px -7px; filter: brightness(.45) contrast(1.2); }
    40%      { translate: -7px -4px; filter: brightness(1.1) contrast(1.3) saturate(1.3); }
    55%      { translate: 6px 5px; filter: brightness(.55) contrast(1.2); }
    70%      { translate: -4px 2px; filter: brightness(.9) contrast(1.2); }
    85%      { translate: 2px -1px; filter: brightness(.7) contrast(1.15); }
  }

  /* bei "Bewegung reduzieren": Zucken nur als Aufglühen */
  @keyframes jolt-light {
    0%, 100% { filter: brightness(.7) contrast(1.15); }
    20%      { filter: brightness(1) contrast(1.35) saturate(1.3); }
    45%      { filter: brightness(.45) contrast(1.2); }
    65%      { filter: brightness(.9) contrast(1.3); }
  }

  @keyframes imgflicker {
    0%, 100% { filter: brightness(.6) contrast(1.1); }
    8%       { filter: brightness(.3) contrast(1.1); }
    10%      { filter: brightness(.75) contrast(1.1); }
    12%      { filter: brightness(.4) contrast(1.1); }
    30%      { filter: brightness(.65) contrast(1.1); }
    52%      { filter: brightness(.25) contrast(1.1); }
    54%      { filter: brightness(.8) contrast(1.1); }
    56%      { filter: brightness(.55) contrast(1.1); }
    78%      { filter: brightness(.7) contrast(1.1); }
    80%      { filter: brightness(.35) contrast(1.1); }
    82%      { filter: brightness(.6) contrast(1.1); }
  }

  @keyframes eyes-awake {
    0%, 100% { opacity: .5; }
    20%      { opacity: 1; }
    30%      { opacity: .1; }
    45%      { opacity: 1; }
    60%      { opacity: .3; }
    80%      { opacity: 1; }
  }

  @keyframes settle-breathe { 0%, 100% { opacity: .7; } 50% { opacity: .4; } }

  /* gleiche Schritte wie @keyframes eyes */
  @keyframes smoulder {
    0%, 100% { color: #5c1810; text-shadow: 0 0 .15em rgba(110, 8, 4, .35), 0 2px 0 #000; }
    40%      { color: #8a2618; text-shadow: 0 0 .3em rgba(170, 20, 8, .6), 0 2px 0 #000; }
    46%      { color: #3e0f0a; text-shadow: 0 0 .1em rgba(90, 5, 3, .25), 0 2px 0 #000; }
    50%      { color: #7a2014; text-shadow: 0 0 .26em rgba(150, 15, 6, .55), 0 2px 0 #000; }
    70%      { color: #641a12; text-shadow: 0 0 .2em rgba(120, 10, 5, .45), 0 2px 0 #000; }
  }

  /* Handy hochkant: 2×2 */
  @media (max-width: 520px) {
    .countdown { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem 1rem; width: min(100%, 300px); }
    .num { font-size: clamp(2rem, 11vw, 2.8rem); }
    main { padding-bottom: max(28px, 5vh); }
  }

  /* Handy quer: wenig Höhe -> kompakte Zahlen, Bild bleibt frei */
  @media (max-height: 520px) and (orientation: landscape) {
    .countdown { width: min(100%, 520px); gap: .6rem; }
    .unit { padding: .4rem .2rem; }
    .num { font-size: clamp(1.4rem, 9vh, 2.4rem); }
    .label { margin-top: .3rem; font-size: .55rem; letter-spacing: .2em; }
    main { padding-bottom: 14px; }
    .hint { bottom: 10px; }
    /* Schrift der Szenen kleiner, damit die übereinander gestaffelten Texte sich nicht berühren */
    .ghost.name { font-size: clamp(1.1rem, 7vh, 1.8rem); }
    .ghost.whisper, .ghost.whisper.ask { font-size: clamp(1rem, 6vh, 1.6rem); }
  }

  /* "Bewegung reduzieren" (iOS/macOS/Android): nur Zoomen und Skalieren weglassen –
     Glimmen, Nebel und Überblendungen bleiben, sonst wäre die Seite komplett starr */
  @media (prefers-reduced-motion: reduce) {
    .scene, .figure, body.awake .figure { animation: none; }
    body.opening .stage { transform: translate(-50%, -50%); }
    body.opening .slit { transform: none; }
    .burst i,
    body.opening .burst i,
    body.opening .burst i:nth-child(2),
    body.opening .burst i:nth-child(3) { transform: translate(-50%, -50%) scale(1); transition: none; }
    .unit.tick .num { transform: none; }
    .ghost .ch.fall, .ghost.whisper.out { transform: none; }
    #count .appar.run .appar-head,
    body.awake #count .appar.final .appar-head { animation: none; }
    #count .appar.run.jolt img:not(.echo) { animation: jolt-light .5s linear; }
  }
</style>
</head>
<body>

<!-- ======== Countdown (liegt unter dem Tor) ======== -->

<!-- ======== Das Tor ======== -->
<section class="screen" id="gate">

<button class="sound-toggle" id="soundToggle" aria-label="Ton an/aus">
  <svg class="on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
  <svg class="off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m23 9-6 6"/><path d="m17 9 6 6"/></svg>
</button>

<div class="blackout"></div>

<script>
  // Mi, 14.10.2026 19:00 Schweizer Zeit (Sommerzeit MESZ, UTC+2)
  // Vorschau:
  //   ?preview1 -> 70 h vor Ablauf: nur Mephisto
  //   ?preview2 -> 30 h vor Ablauf: Dia, Mephisto
  //   ?preview3 -> 20 h vor Ablauf: Baal, Dia, Mephisto
  //   ?preview4 -> Ablauf 1 min nach dem Öffnen des Tors: eine Szene, danach das Finale
  const params = new URLSearchParams(location.search);
  const PREVIEW_HOURS = { preview1: 70, preview2: 30, preview3: 20 };
  const previewHours = Object.keys(PREVIEW_HOURS).find(k => params.has(k));
  const PREVIEW_END = params.has('preview4');
  const PREVIEW_END_SECONDS = 60;
  let TARGET = previewHours ? Date.now() + PREVIEW_HOURS[previewHours] * 3600000
    : PREVIEW_END ? Date.now() + PREVIEW_END_SECONDS * 1000
    : new Date('2026-10-14T19:00:00+02:00').getTime();

  const INTRO_VOLUME = 0.5;
  const VOICE_VOLUME = 1;
  const VOICE_FADE_IN = 0.4;   // Sekunden
  const VOICE_FADE_OUT = 1.5;  // Sekunden am Ende der Stimme
  const MUSIC_DUCK = 0.25;     // Musiklautstärke, solange die Stimme spricht
  const LAUGH_VOLUME = 0.9;
  const FINALE_MIN = 7000;     // so lange bleibt ein Bild im Finale mindestens stehen
  const FINALE_HOLD = 1500;    // nach dem Verklingen des Tons noch so lange, dann Überblenden
  const INTRO_FADE_IN = 4;     // Sekunden beim allerersten Start
  const LOOP_CROSSFADE = 15;   // Sekunden: Ende ausblenden, Anfang einblenden

  /* =========================================================
     Ton
     ========================================================= */

  // zwei Instanzen des Intros, damit Ende und Anfang überblendet werden können
  const intro = [new Audio('data/intro.mp3'), new Audio('data/intro.mp3')];
  // zwei Instanzen des Lachens (Tor-Klick und Finale)
  const laughs = [new Audio('data/laugh.mp3'), new Audio('data/laugh.mp3')];
  // Stimmen zu den Dämonen-Szenen
  const mepVoice = new Audio('data/mep_audio.mp3');
  const diaVoice = new Audio('data/dia_audio.mp3');
  const baalVoice = new Audio('data/baal_laugh.mp3');
  const voices = [mepVoice, diaVoice, baalVoice];
  const allAudio = [...intro, ...laughs, ...voices];
  allAudio.forEach(a => { a.preload = 'auto'; });

  let current = 0;
  let introStarted = false;
  let crossfading = false;
  let muted = false;

  function fade(audio, to, seconds, done) {
    clearInterval(audio._fade);
    const from = audio.volume;
    const start = performance.now();
    audio._fade = setInterval(() => {
      const p = Math.min((performance.now() - start) / (seconds * 1000), 1);
      audio.volume = Math.min(Math.max(from + (to - from) * p, 0), 1);
      if (p === 1) {
        clearInterval(audio._fade);
        if (done) done();
      }
    }, 50);
  }

  function startIntro() {
    if (introStarted) return;
    introStarted = true;
    const a = intro[current];
    a.volume = 0;
    a.play()
      .then(() => fade(a, INTRO_VOLUME, INTRO_FADE_IN))
      .catch(() => { introStarted = false; }); // Autoplay blockiert -> bei erster Interaktion erneut
  }

  // Loop mit Überblendung: kurz vor Schluss den Anfang parallel einblenden
  setInterval(() => {
    const a = intro[current];
    if (!introStarted || crossfading || !a.duration || a.paused) return;
    const len = Math.min(LOOP_CROSSFADE, a.duration / 3);
    if (a.currentTime < a.duration - len) return;

    crossfading = true;
    const b = intro[1 - current];
    b.currentTime = 0;
    b.volume = 0;
    b.play().catch(() => {});
    fade(b, INTRO_VOLUME, len);
    fade(a, 0, len, () => { a.pause(); crossfading = false; });
    current = 1 - current;
  }, 250);

  // iOS: jedes Audio-Element muss einmal innerhalb einer Berührung gestartet werden,
  // sonst darf es später (Loop-Überblendung, Lach-Schleife) nicht mehr spielen
  // play() und sofort pause(): der Aufruf in der Berührung genügt zum Freischalten,
  // abgespielt wird nichts (stumm schalten allein greift auf manchen Handys nicht)
  function unlock(a) {
    a.muted = true;
    const p = a.play();
    a.pause();
    a.currentTime = 0;
    return Promise.resolve(p)
      .catch((err) => { if (err && err.name === 'NotAllowedError') throw err; }) // AbortError durch pause() ist gewollt
      .finally(() => { a.muted = muted; });
  }

  let unlocked = false;
  function unlockSpare() {
    if (unlocked) return;
    unlocked = true;
    unlock(intro[1 - current]).catch(() => { unlocked = false; });
  }

  // Musik leiser stellen, solange eine Stimme spricht (nicht mitten in der Loop-Überblendung)
  function duckMusic(on) {
    if (!introStarted || crossfading) return;
    fade(intro[current], on ? MUSIC_DUCK : INTRO_VOLUME, on ? 1 : 2.5);
  }

  // Stimme kurz ein- und am Ende wieder ausblenden, damit sie sich in die Musik legt.
  // Kehrt zurück, wenn sie verklungen ist (oder nicht abgespielt werden durfte).
  function playVoice(a) {
    return new Promise(resolve => {
      let tail;
      // 'pause' auch, falls sie vorzeitig angehalten wird (Finale)
      const done = () => {
        clearInterval(tail);
        a.removeEventListener('ended', done);
        a.removeEventListener('pause', done);
        duckMusic(false);
        resolve();
      };
      a.currentTime = 0;
      a.volume = 0;
      a.play()
        .then(() => {
          fade(a, VOICE_VOLUME, VOICE_FADE_IN);
          duckMusic(true);
          a.addEventListener('ended', done);
          a.addEventListener('pause', done);
          tail = setInterval(() => {
            // bei kurzen Tönen (Baals Lachen) nur das letzte Viertel ausblenden
            const len = Math.min(VOICE_FADE_OUT, a.duration / 4);
            if (!a.duration || a.currentTime < a.duration - len) return;
            clearInterval(tail);
            fade(a, 0, len);
          }, 100);
        })
        .catch(() => resolve());
    });
  }

  // Browser erlauben Ton meist erst nach einer Interaktion
  startIntro();
  ['pointerdown', 'keydown', 'touchend'].forEach(type =>
    document.addEventListener(type, (e) => {
      unlockSpare();
      if (e.target.closest && e.target.closest('#soundToggle')) return;
      startIntro();
    }, { passive: true })
  );

  const toggle = document.getElementById('soundToggle');
  toggle.addEventListener('click', () => {
    muted = !muted;
    allAudio.forEach(a => { a.muted = muted; });
    toggle.classList.toggle('muted', muted);
    startIntro();
  });

  /* =========================================================
     Tor öffnen
     ========================================================= */

  const gate = document.getElementById('gate');
  const count = document.getElementById('count');
  const door = document.getElementById('door');
  let opened = false;

  door.addEventListener('click', () => {
    if (opened) return;
    opened = true;
    // ?preview4: erst ab jetzt zählen, egal wie lange das Tor vorher zu war
    if (PREVIEW_END) { TARGET = Date.now() + PREVIEW_END_SECONDS * 1000; update(); }

    startIntro();
    playLaugh();
    unlock(laughs[laughIndex]).catch(() => {}); // die andere Instanz für die spätere Schleife
    voices.forEach(v => unlock(v).catch(() => {}));

    document.body.classList.add('opening');
    count.removeAttribute('aria-hidden');

    setTimeout(() => {
      // haunt();   // Namen + "ich sehe euch" / "ich warte auf euch" – vorerst ersetzt durch rotate()
      rotate();
      if (awake) { startAwake(); return; }
      emberMode = 'count'; resize(); initEmbers();
    }, 2600);
    setTimeout(() => { gate.hidden = true; }, 4500);
  });

  /* =========================================================
     Countdown abgelaufen: Funkenregen + zufällig wechselnde Dämonen mit ihrem Ton
     ========================================================= */

  let awake = false;
  let awakeStarted = false;

  let laughIndex = 0;

  // abwechselnd beide Instanzen, damit ein noch laufendes Lachen nicht abgeschnitten wird
  function playLaugh() {
    const a = laughs[laughIndex];
    laughIndex = 1 - laughIndex;
    a.currentTime = 0;
    a.volume = LAUGH_VOLUME;
    a.play().catch(() => {});
  }

  // erst, wenn das Tor geöffnet ist (vorher wäre Ton ohnehin blockiert)
  function startAwake() {
    if (awakeStarted) return;
    awakeStarted = true;
    emberMode = 'rain';
    resize();
    initEmbers();
    // spricht ein Dämon noch, ihn ausblenden
    voices.forEach(v => { if (!v.paused) fade(v, 0, 1.5, () => v.pause()); });
    duckMusic(false);
    finale();
  }

  // Finale: zufällig zwischen Schädel und Dämonen wechseln, jeder mit seinem Ton;
  // erst wenn der Ton verklungen ist, ins nächste Bild überblenden
  async function finale() {
    const items = [
      { el: null, voice: laughs[0] },   // der Schädel lacht
      ...SCENES.map(s => ({ el: s.el, voice: s.voice })),
    ];
    const show = (item, on) => {
      if (item.el) item.el.classList.toggle('final', on);
      else count.classList.toggle('final-off', !on);
    };

    // erst alles ins Dunkel, dann die beiden Sätze
    count.classList.add('final-off');
    const ft1 = document.querySelector('.finale-words .ft1');
    const ft2 = document.querySelector('.finale-words .ft2');
    await sleep(2500);
    ft1.classList.add('in');
    await sleep(4500);
    ft1.classList.remove('in');
    await sleep(2200);
    ft2.classList.add('in');
    await sleep(4500);
    ft2.classList.add('settle');   // bleibt unten stehen, gedämpft
    await sleep(1500);

    // dann die Dämonen (und der Schädel) in zufälligem Wechsel
    let cur = null;
    while (true) {
      const others = items.filter(i => i !== cur);
      const next = others[Math.floor(Math.random() * others.length)];
      show(next, true);
      if (cur) show(cur, false);
      cur = next;

      const shown = Date.now();
      await sleep(1500);   // das Bild erst ein Stück einblenden lassen
      await playVoice(cur.voice);
      await sleep(Math.max(FINALE_HOLD, FINALE_MIN - (Date.now() - shown)));
    }
  }

  /* =========================================================
     Countdown
     ========================================================= */

  const fields = {
    d: document.getElementById('d'),
    h: document.getElementById('h'),
    m: document.getElementById('m'),
    s: document.getElementById('s'),
  };

  function setField(el, value) {
    if (el.textContent === value) return;
    el.textContent = value;
    // neue Ziffer aus dem Dunkel auftauchen lassen
    const unit = el.parentElement;
    unit.classList.add('tick');
    requestAnimationFrame(() => requestAnimationFrame(() => unit.classList.remove('tick')));
  }

  function update() {
    const diff = TARGET - Date.now();
    if (diff <= 0) {
      awake = true;
      document.body.classList.add('awake');
      clearInterval(timer);
      if (opened) startAwake();
      return;
    }
    const sec = Math.floor(diff / 1000);
    setField(fields.d, String(Math.floor(sec / 86400)).padStart(2, '0'));
    setField(fields.h, String(Math.floor(sec / 3600) % 24).padStart(2, '0'));
    setField(fields.m, String(Math.floor(sec / 60) % 60).padStart(2, '0'));
    setField(fields.s, String(sec % 60).padStart(2, '0'));
  }

  const timer = setInterval(update, 250);
  update();

  /* ---------- Ziffern: zufälliges Aussetzen ---------- */

  const units = [...document.querySelectorAll('.unit')];

  function scheduleFlicker() {
    setTimeout(() => {
      const unit = units[Math.floor(Math.random() * units.length)];
      unit.classList.add('flicker');
      setTimeout(() => unit.classList.remove('flicker'), 70 + Math.random() * 180);
      // manchmal ein zweites, kurzes Zucken
      if (Math.random() < .35) {
        setTimeout(() => {
          unit.classList.add('flicker');
          setTimeout(() => unit.classList.remove('flicker'), 60);
        }, 320);
      }
      scheduleFlicker();
    }, 4000 + Math.random() * 9000);
  }
  scheduleFlicker();

  /* =========================================================
     Geisterschrift
     ========================================================= */

  const ghosts = document.getElementById('ghosts');

  // mögliche Stellen (Mitte des Textes, Anteil des Bildschirms);
  // welche frei ist, wird beim Einblenden geprüft (siehe makeGhost)
  // nur über dem Kopf sowie links und rechts davon – darunter ist der Countdown
  const GHOST_SLOTS = [
    { x: .22, y: .06 }, { x: .5,  y: .06 }, { x: .78, y: .07 },
    { x: .2,  y: .14 }, { x: .5,  y: .14 }, { x: .8,  y: .15 },
    { x: .14, y: .26 }, { x: .86, y: .27 },
    { x: .12, y: .36 }, { x: .88, y: .37 },
    { x: .14, y: .46 }, { x: .86, y: .45 },
  ];

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const rand = (a, b) => a + Math.random() * (b - a);
  const shuffle = arr => arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(p => p[1]);

  // Bereiche, die eine Geisterschrift nicht verdecken darf (Bildschirmkoordinaten)
  function ghostObstacles() {
    const list = [...ghosts.querySelectorAll('.ghost')].map(g => g.getBoundingClientRect());
    const info = document.querySelector(document.body.classList.contains('awake') ? '.finale-words .ft2' : '.countdown');
    list.push(info.getBoundingClientRect());
    list.push(document.getElementById('soundToggle').getBoundingClientRect());
    // die Figur: Mitra, Kapuze und Schädel …
    const p = document.querySelector('.portrait').getBoundingClientRect();
    list.push({
      left: p.left + p.width * .27, right: p.left + p.width * .73,
      top: p.top + p.height * .2, bottom: p.top + p.height * .56,
    });
    // … sowie Schultern und Körper darunter (nur innerhalb des Bildes)
    list.push({
      left: p.left, right: p.right,
      top: p.top + p.height * .5, bottom: p.bottom,
    });
    return list;
  }

  const overlaps = (a, b) => a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom;

  // slot (optional): feste Stelle { x, y } statt einer freien aus GHOST_SLOTS
  function makeGhost(text, cls, slot) {
    const el = document.createElement('div');
    el.className = 'ghost ' + cls;
    // Buchstaben einzeln (zum Zerfallen), Wörter zusammengehalten (Umbruch nur dazwischen)
    text.split(' ').forEach((word, i) => {
      if (i) el.appendChild(document.createTextNode(' '));
      const w = document.createElement('span');
      w.className = 'w';
      for (const c of word) {
        const span = document.createElement('span');
        span.className = 'ch';
        span.textContent = c;
        w.appendChild(span);
      }
      el.appendChild(w);
    });
    const obstacles = ghostObstacles(); // vor dem Einfügen, damit el sich nicht selbst im Weg steht
    ghosts.appendChild(el);

    // Stellen in zufälliger Reihenfolge durchprobieren und die erste freie nehmen;
    // jeweils an der Stelle zentriert, aber nie über den Rand hinaus
    const g = ghosts.getBoundingClientRect();
    const w = el.offsetWidth, h = el.offsetHeight;
    const gap = 10;
    let pos = null;
    const short = matchMedia('(max-height: 520px) and (orientation: landscape)').matches;
    for (const s of slot ? [slot] : shuffle(GHOST_SLOTS)) {
      const sy = short && s.yShort != null ? s.yShort : s.y;
      const x = Math.min(Math.max(s.x * g.width - w / 2, 16), g.width - w - 16);
      const y = Math.min(Math.max(sy * g.height - h / 2, 16), g.height - h - 16);
      if (slot) { pos = { x, y }; break; }
      const box = { left: g.left + x - gap, right: g.left + x + w + gap, top: g.top + y - gap, bottom: g.top + y + h + gap };
      if (!obstacles.some(o => overlaps(box, o))) { pos = { x, y }; break; }
    }
    // nirgends Platz (z. B. Handy quer): ganz oben über dem Kopf zeigen –
    // möglichst nicht auf einem anderen Geistertext, sonst einfach mittig
    if (!pos) {
      const others = [...ghosts.querySelectorAll('.ghost')].filter(o => o !== el).map(o => o.getBoundingClientRect());
      const ys = [8, ...others.map(o => o.bottom - g.top + 4)];                    // ganz oben, sonst direkt unter einem anderen Text
      const xs = [(g.width - w) / 2, 16, Math.max(16, g.width - w - 16 - 52),      // rechts Platz für den Ton-Knopf
                  g.width * .25 - w / 2, g.width * .7 - w / 2].map(x => Math.max(16, x));
      pos = { x: xs[0], y: ys[0] };
      search:
      for (const y of ys) {
        for (const x of xs) {
          const box = { left: g.left + x - gap, right: g.left + x + w + gap, top: g.top + y, bottom: g.top + y + h + gap };
          if (!others.some(o => overlaps(box, o))) { pos = { x, y }; break search; }
        }
      }
    }
    el.style.left = pos.x + 'px';
    el.style.top = pos.y + 'px';

    el.offsetWidth; // Startzustand übernehmen, damit das Einblenden animiert
    el.classList.add('in');
    return el;
  }

  // Name blendet ein, dann fallen die Buchstaben in zufälliger Reihenfolge weg.
  // Kehrt zurück, sobald das Zerfallen beginnt (der nächste Name darf schon kommen).
  async function nameCrumbles(text, slot) {
    const el = makeGhost(text, 'name', slot);
    await sleep(1800 + 1400);
    const chars = shuffle([...el.querySelectorAll('.ch')]);
    chars.forEach((ch, i) => {
      ch.style.setProperty('--dx', rand(-25, 25) + 'px');
      ch.style.setProperty('--dy', rand(50, 140) + 'px');
      ch.style.setProperty('--rot', rand(-50, 50) + 'deg');
      setTimeout(() => ch.classList.add('fall'), i * 180 + rand(0, 120));
    });
    setTimeout(() => el.remove(), chars.length * 180 + 2200);
  }

  // Flüstern blendet ein und verweht nach oben.
  // Kehrt zurück, sobald es zu verwehen beginnt (das nächste darf schon kommen).
  async function whisper(text, slot, cls = '') {
    const el = makeGhost(text, ('whisper ' + cls).trim(), slot);
    await sleep(2500 + 3000);
    el.classList.add('out');
    setTimeout(() => el.remove(), 2700);
  }

  /* =========================================================
     Szenen-Rotation (ab 72 h vor Ablauf, ohne Schädel):
     Texte (+ Lachen) -> neuester Dämon -> Texte (+ Lachen) -> nächster Dämon -> …
     ========================================================= */

  const SCENE_CYCLE = 32000;    // so lange dauert eine Szene (Texte + Dämon) höchstens ungefähr
  const SCENE_MIN = 9000;       // so lange bleibt ein Dämon mindestens sichtbar (auch bei kurzem Ton)

  // feste Stellen für die Schrift zwischen zwei Dämonen
  // (yShort: Handy quer, dort ist über dem Countdown nur wenig Höhe frei)
  const SLOT_NAME_1 = { x: .5, y: .3,  yShort: .14 };
  const SLOT_NAME_2 = { x: .5, y: .4,  yShort: .3 };
  const SLOT_ASK    = { x: .5, y: .52, yShort: .5 };
  const SLOT_ASK_HI = { x: .5, y: .46, yShort: .45 };
  const SLOT_ASK_LO = { x: .5, y: .56, yShort: .6 };

  const HOUR = 3600000;

  // freigeschaltet, sobald weniger als `hours` Stunden bis zum Ablauf übrig sind;
  // die neueste Szene (wenigste Stunden) kommt jeweils zuerst, die älteren danach
  const SCENES = [
    {
      el: document.getElementById('baal'), hours: 24, voice: baalVoice,
      async intro() {
        await nameCrumbles('Timea', SLOT_NAME_1);
        await sleep(700);
        await nameCrumbles('Benjamin', SLOT_NAME_2);
        await sleep(1200);
        await whisper('…\u00a0ich habe euch gefunden!', SLOT_ASK_HI, 'ask');
        await whisper('Heute komme ich zu euch!', SLOT_ASK_LO, 'ask');
      },
    },
    {
      el: document.getElementById('dia'), hours: 48, voice: diaVoice,
      async intro() {
        await nameCrumbles('Benjamin, Timea\u00a0…', SLOT_NAME_1);
        await sleep(1200);
        await whisper('…\u00a0es naht das Ende!', SLOT_ASK, 'ask');
      },
    },
    {
      el: document.getElementById('mep'), hours: 72, voice: mepVoice,
      async intro() {
        await nameCrumbles('Timea', SLOT_NAME_1);
        await sleep(700);
        await nameCrumbles('Benjamin', SLOT_NAME_2);
        await sleep(1200);
        await whisper('Seid ihr wirklich bereit?', SLOT_ASK, 'ask');
      },
    },
  ].sort((a, b) => a.hours - b.hours);

  const activeScenes = () => SCENES.filter(s => TARGET - Date.now() <= s.hours * HOUR);

  // ist schon ein Dämon freigeschaltet, den Schädel gar nicht erst zeigen (liegt noch unter dem Tor)
  if (activeScenes().length) count.classList.add('skull-off');

  // kurz vor Ablauf keine neue Szene beginnen, damit nichts in den Wechsel zum Finale hineinragt
  const tooLate = () => TARGET - Date.now() < SCENE_CYCLE + 5000;

  // der Dämon zuckt in zufälligen Abständen
  function scheduleJolts(el) {
    let t;
    const next = () => {
      t = setTimeout(() => {
        el.classList.add('jolt');
        setTimeout(() => el.classList.remove('jolt'), 500);
        next();
      }, rand(1500, 4500));
    };
    next();
    return () => { clearTimeout(t); el.classList.remove('jolt'); };
  }

  // vorher die Texte auf schwarzem Grund, dazu das Lachen
  async function showScene(scene) {
    // steht noch der Schädel (Freischaltung bei offener Seite), ihn erst langsam ausblenden
    if (!count.classList.contains('skull-off')) {
      count.classList.add('skull-off');
      await sleep(2000);
    }
    // läuft das Lachen vom Tor-Klick noch, kein zweites darüberlegen
    setTimeout(() => { if (!awake && laughs.every(a => a.paused)) playLaugh(); }, 600);
    await scene.intro();
    if (awake) return;

    // der Dämon erscheint, nach einem Moment spricht er
    const el = scene.el;
    el.classList.add('on', 'run');
    scene.stopJolts = scheduleJolts(el);
    const shown = Date.now();
    await sleep(rand(1000, 2000));
    await playVoice(scene.voice);
    await sleep(Math.max(2500, SCENE_MIN - (Date.now() - shown)));
  }

  // Dämon ausblenden; kehrt schon während des Ausblendens zurück, damit die Texte nachrücken
  async function hideScene(scene) {
    scene.el.classList.remove('on');
    setTimeout(() => {
      scene.stopJolts();
      scene.el.classList.remove('run');
    }, 3000);
    await sleep(1500);
  }

  let rotating = false;
  async function rotate() {
    if (rotating) return;
    rotating = true;
    // Schriften der Texte vorab laden – sonst wird ein Text mit der Ersatzschrift vermessen und sitzt schief
    if (document.fonts) document.fonts.load('1em "UnifrakturMaguntia"').catch(() => {});
    if (document.fonts) document.fonts.load('1em "Jim Nightshade"').catch(() => {});

    let cur = null;   // der gerade sichtbare Dämon
    await sleep(1500); // den Countdown nach dem Tor erst einblenden lassen
    // vor 72 h ist noch nichts freigeschaltet: nur der Schädel
    rounds:
    while (!awake) {
      const scenes = activeScenes();
      if (!scenes.length) { await sleep(5000); continue; }
      for (const scene of scenes) {
        // kurz vor Ablauf bleibt der aktuelle Dämon bis zum Finale stehen
        if (cur && tooLate()) {
          while (!awake) await sleep(1000);
          break rounds;
        }
        if (cur) await hideScene(cur);
        if (awake) break rounds;
        await showScene(scene);
        cur = scene;
        if (awake) break rounds;
      }
    }
    if (cur && cur.stopJolts) cur.stopJolts();
    count.classList.remove('skull-off');
    SCENES.forEach(s => s.el.classList.remove('on', 'run', 'jolt'));
  }

  /* ---------- vorerst ersetzt durch rotate(): Namen + "ich sehe euch" / "ich warte auf euch" ----------

  // kurz vor Ablauf still sein, damit keine Schrift in den Wechsel zum Finale hineinragt
  const GHOST_CYCLE = 25000;   // so lange dauert ein Durchgang ungefähr
  const GHOST_QUIET = 30000;   // vor Ablauf frei halten

  async function waitForQuiet() {
    let waited = false;
    while (!awake && TARGET - Date.now() < GHOST_QUIET + GHOST_CYCLE) {
      waited = true;
      await sleep(1000);
    }
    if (waited) await sleep(6000); // nach dem Wechsel das Finale erst wirken lassen
  }

  let haunting = false;
  async function haunt() {
    if (haunting) return;
    haunting = true;
    await sleep(5000);
    while (true) {
      await waitForQuiet();
      await nameCrumbles('Benjamin');
      await sleep(700);
      await nameCrumbles('Timea');
      await sleep(1600);
      await whisper('… ich sehe euch …');
      await sleep(1200);
      // dazu lachen – nach Ablauf läuft das Lachen ohnehin in Schleife
      if (!awakeStarted) playLaugh();
      await whisper('… ich warte auf euch …');
      await sleep(2700 + rand(9000, 17000));
    }
  }

  ---------- */

  /* =========================================================
     Glut / Funken
     ========================================================= */

  const canvas = document.getElementById('embers');
  const ctx = canvas.getContext('2d');
  let W, H, embers = [];
  let emberMode = 'gate';

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function spawn(initial) {
    const e = {
      x: Math.random() * W,
      y: initial ? Math.random() * H : H + 10,
      vx: (Math.random() - .5) * .3,
      vy: -(.2 + Math.random() * .7),
      r: .5 + Math.random() * 1.4,
      life: 0,
      maxLife: 300 + Math.random() * 500,
      wobble: Math.random() * Math.PI * 2,
    };
    if (emberMode === 'gate') {
      // vor allem vor dem Tor
      e.x = W / 2 + (Math.random() - .5) * Math.min(W, 900);
    } else if (emberMode === 'rain') {
      // Funken regnen von oben herab
      e.y = initial ? Math.random() * H : -5;
      e.vx = (Math.random() - .5) * .6;
      e.vy = .8 + Math.random() * 1.6;
      e.maxLife = (H + 20) / e.vy;
      e.life = (e.y + 5) / e.vy;
    }
    return e;
  }

  const EMBER_COUNT = { gate: 36, count: 28, rain: 70 };

  function initEmbers() {
    const base = EMBER_COUNT[emberMode];
    const count = W < 600 ? Math.round(base / 2) : base;
    embers = Array.from({ length: count }, () => spawn(true));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < embers.length; i++) {
      const e = embers[i];
      e.life++;
      e.wobble += .03;
      e.x += e.vx + Math.sin(e.wobble) * .25;
      e.y += e.vy;
      const fade = Math.sin(Math.min(e.life / e.maxLife, 1) * Math.PI);
      if (e.life > e.maxLife || e.y < -10 || e.y > H + 10) { embers[i] = spawn(false); continue; }

      ctx.fillStyle = `rgba(255, 75, 20, ${.08 * fade})`;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(255, 165, 85, ${.6 * fade})`;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', () => { resize(); initEmbers(); });
  resize();
  initEmbers();
  draw();
</script>
</body>
</html>
